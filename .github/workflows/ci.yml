name: CI

on: [push, pull_request]

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # x86_64  +  Apple-Silicon (arm64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install differential-test oracles
        run: python -m pip install --upgrade numpy ml_dtypes gguf

      # Regenerates the golden vectors on THIS runner's arch, so the differential
      # suites (vs ml_dtypes / numpy) actually run instead of skipping — enforcing
      # bit-exactness on both x86_64 and arm64.
      - name: Generate golden reference vectors
        run: python tests/gen_reference.py

      - name: Run conformance suite
        run: nimble test

      # macos-latest runners are Apple Silicon, so the NEON suite runs in CI too
      # (SDOT, streaming and pool legs included via the nimble task). The README's
      # old "NEON is verified locally" era ended when GitHub switched these
      # runners to M-series. Fail loudly if the runner ever reverts to x86.
      - name: Assert runner is arm64
        if: matrix.os == 'macos-latest'
        run: test "$(uname -m)" = "arm64"

      - name: Run NEON SIMD suite
        if: matrix.os == 'macos-latest'
        run: nimble simd
